<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obedová pauza</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .date {
            color: #666;
            margin-bottom: 25px;
        }

        .user {
            font-size: 24px;
            padding: 12px 0;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .available {
            color: #2e7d32;
            font-weight: bold;
        }

        .unavailable {
            color: #999999;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<h1>🍽️ ☕ 🚶 Obedová pauza</h1>

<div id="today" class="date"></div>

<div id="availableUsers"></div>

<hr>

<div id="unavailableUsers"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDIgpNqTfom-cIQVmDTU351KxFfK-BiRdM",
    authDomain: "obedna-pauza.firebaseapp.com",
    projectId: "obedna-pauza",
    storageBucket: "obedna-pauza.firebasestorage.app",
    messagingSenderId: "344992044371",
    appId: "1:344992044371:web:174bca2238030df816fda6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const availableUsers = document.getElementById("availableUsers");
const unavailableUsers = document.getElementById("unavailableUsers");

const today = new Date().toISOString().split("T")[0];

document.getElementById("today").textContent =
    new Date().toLocaleDateString("sk-SK");

function surname(name) {
    const parts = name.trim().split(" ");
    return parts[parts.length - 1].toLowerCase();
}

function sortContainer(container) {
    const items = Array.from(container.children);

    items.sort((a, b) =>
        surname(a.textContent).localeCompare(
            surname(b.textContent),
            "sk"
        )
    );

    items.forEach(item => container.appendChild(item));
}

async function toggleUser(user, element) {

    const newAvailable = !user.available;

    await updateDoc(doc(db, "users", user.id), {
        available: newAvailable,
        date: today
    });

    user.available = newAvailable;
    user.date = today;

    if (newAvailable) {
        element.classList.remove("unavailable");
        element.classList.add("available");

        availableUsers.appendChild(element);
        sortContainer(availableUsers);

    } else {
        element.classList.remove("available");
        element.classList.add("unavailable");

        unavailableUsers.appendChild(element);
        sortContainer(unavailableUsers);
    }
}

async function loadUsers() {

    availableUsers.innerHTML = "";
    unavailableUsers.innerHTML = "";

    const users = [];

    const querySnapshot = await getDocs(collection(db, "users"));

    querySnapshot.forEach((userDoc) => {
        users.push({
            id: userDoc.id,
            ...userDoc.data()
        });
    });

    users.sort((a, b) =>
        surname(a.name).localeCompare(
            surname(b.name),
            "sk"
        )
    );

    users.forEach((user) => {

        const activeToday =
            user.date === today &&
            user.available === true;

        const div = document.createElement("div");

        div.textContent = user.name;
        div.className =
            "user " +
            (activeToday ? "available" : "unavailable");

        div.addEventListener("click", () => {
            toggleUser(
                {
                    ...user,
                    available: activeToday
                },
                div
            );
        });

        if (activeToday) {
            availableUsers.appendChild(div);
        } else {
            unavailableUsers.appendChild(div);
        }
    });
}

loadUsers();

</script>

</body>
</html>
