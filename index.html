<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obedová pauza</title>
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .date {
            color: #888;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .user {
            font-size: 24px;
            padding: 12px 0;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .available {
            color: #2e7d32;
            font-weight: bold;
        }

        .unavailable {
            color: #999999;
        }

        .separator {
            height: 50px;
        }
    </style>
</head>
<body>

    <h1>🍽️☕🚶</h1>

    <div id="today" class="date"></div>

    <div id="availableUsers"></div>

    <div class="separator"></div>

    <div id="unavailableUsers"></div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIgpNqTfom-cIQVmDTU351KxFfK-BiRdM",
            authDomain: "obedna-pauza.firebaseapp.com",
            projectId: "obedna-pauza",
            storageBucket: "obedna-pauza.firebasestorage.app",
            messagingSenderId: "344992044371",
            appId: "1:344992044371:web:174bca2238030df816fda6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const availableUsers = document.getElementById("availableUsers");
        const unavailableUsers = document.getElementById("unavailableUsers");

        const today = new Date().toLocaleDateString("sv-SE");

        const weekday = new Date().toLocaleDateString(
            "sk-SK",
            { weekday: "long" }
        );

        const datePart = new Date().toLocaleDateString("sk-SK");

        document.getElementById("today").textContent =
            `${weekday}, ${datePart}`;

        function surname(name) {
            const parts = name.trim().split(" ");
            return parts[parts.length - 1].toLowerCase();
        }

        function displayName(name) {

            const parts = name.trim().split(" ");

            if (parts.length < 2) {
                return name;
            }

            const firstName = parts[0];
            const lastName = parts.slice(1).join(" ");

            return `${lastName} ${firstName}`;
        }

        function sortContainer(container) {

            const items = Array.from(container.children);

            items.sort((a, b) =>
                surname(a.dataset.name).localeCompare(
                    surname(b.dataset.name),
                    "sk"
                )
            );

            items.forEach(item =>
                container.appendChild(item)
            );
        }

        async function toggleUser(user, element) {

            const newAvailable = !user.available;

            await updateDoc(
                doc(db, "users", user.id),
                {
                    available: newAvailable,
                    date: today
                }
            );

            user.available = newAvailable;

            if (newAvailable) {

                element.classList.remove("unavailable");
                element.classList.add("available");

                availableUsers.appendChild(element);
                sortContainer(availableUsers);

            } else {

                element.classList.remove("available");
                element.classList.add("unavailable");

                unavailableUsers.appendChild(element);
                sortContainer(unavailableUsers);

            }
        }

        async function loadUsers() {

            const users = [];

            const querySnapshot =
                await getDocs(collection(db, "users"));

            querySnapshot.forEach((userDoc) => {

                users.push({
                    id: userDoc.id,
                    ...userDoc.data()
                });

            });

            users.sort((a, b) =>
                surname(a.name).localeCompare(
                    surname(b.name),
                    "sk"
                )
            );

            users.forEach((user) => {

                const activeToday =
                    user.available === true &&
                    user.date === today;

                const div = document.createElement("div");

                div.dataset.name = user.name;

                div.className =
                    "user " +
                    (activeToday
                        ? "available"
                        : "unavailable");

                div.textContent =
                    displayName(user.name);

                const uiUser = {
                    id: user.id,
                    available: activeToday
                };

                div.addEventListener("click", () =>
                    toggleUser(
                        uiUser,
                        div
                    )
                );

                if (activeToday) {
                    availableUsers.appendChild(div);
                } else {
                    unavailableUsers.appendChild(div);
                }
            });
        }

        loadUsers();

    </script>

</body>
</html>
