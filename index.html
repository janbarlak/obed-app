<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Obedová pauza</title>
</head>
<body>
    <h1>🍽️ Obedová pauza</h1>

    <h2>Kto ide na obed</h2>
    <div id="checkboxes"></div>

    <h2>Dnes idú na obed</h2>
    <ul id="usersList"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIgpNqTfom-cIQVmDTU351KxFfK-BiRdM",
            authDomain: "obedna-pauza.firebaseapp.com",
            projectId: "obedna-pauza",
            storageBucket: "obedna-pauza.firebasestorage.app",
            messagingSenderId: "344992044371",
            appId: "1:344992044371:web:174bca2238030df816fda6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const usersList = document.getElementById("usersList");
        const checkboxes = document.getElementById("checkboxes");

        async function loadUsers() {
            usersList.innerHTML = "";
            checkboxes.innerHTML = "";

            const querySnapshot = await getDocs(collection(db, "users"));

            querySnapshot.forEach((userDoc) => {
                const data = userDoc.data();

                const label = document.createElement("label");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = data.available;

                checkbox.addEventListener("change", async () => {
                    await updateDoc(doc(db, "users", userDoc.id), {
                        available: checkbox.checked
                    });

                    loadUsers();
                });

                label.appendChild(checkbox);
                label.append(" " + data.name);

                checkboxes.appendChild(label);
                checkboxes.appendChild(document.createElement("br"));

                if (data.available) {
                    const li = document.createElement("li");
                    li.textContent = data.name;
                    usersList.appendChild(li);
                }
            });
        }

        loadUsers();
    </script>
</body>
</html>
