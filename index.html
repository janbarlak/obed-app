<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obedová pauza</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .user {
            font-size: 24px;
            padding: 12px 0;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .available {
            color: #2e7d32;
            font-weight: bold;
        }

        .unavailable {
            color: #999999;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<h1>🍽️ ☕ 🚶 Obedová pauza</h1>

<div id="availableUsers"></div>

<hr>

<div id="unavailableUsers"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDIgpNqTfom-cIQVmDTU351KxFfK-BiRdM",
    authDomain: "obedna-pauza.firebaseapp.com",
    projectId: "obedna-pauza",
    storageBucket: "obedna-pauza.firebasestorage.app",
    messagingSenderId: "344992044371",
    appId: "1:344992044371:web:174bca2238030df816fda6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const availableUsers = document.getElementById("availableUsers");
const unavailableUsers = document.getElementById("unavailableUsers");

function surname(name) {
    const parts = name.trim().split(" ");
    return parts[parts.length - 1].toLowerCase();
}

function sortUsers(users) {
    users.sort((a, b) =>
        surname(a.name).localeCompare(surname(b.name), "sk")
    );
}

async function toggleUser(user, element) {

    const newValue = !user.available;

    await updateDoc(doc(db, "users", user.id), {
        available: newValue
    });

    user.available = newValue;

    if (newValue) {
        element.classList.remove("unavailable");
        element.classList.add("available");
        availableUsers.appendChild(element);
    } else {
        element.classList.remove("available");
        element.classList.add("unavailable");
        unavailableUsers.appendChild(element);
    }
}

async function loadUsers() {

    availableUsers.innerHTML = "";
    unavailableUsers.innerHTML = "";

    const users = [];

    const querySnapshot = await getDocs(collection(db, "users"));

    querySnapshot.forEach((userDoc) => {
        users.push({
            id: userDoc.id,
            ...userDoc.data()
        });
    });

    sortUsers(users);

    users.forEach((user) => {

        const div = document.createElement("div");

        div.className =
            "user " +
            (user.available ? "available" : "unavailable");

        div.textContent = user.name;

        div.addEventListener("click", () => {
            toggleUser(user, div);
        });

        if (user.available) {
            availableUsers.appendChild(div);
        } else {
            unavailableUsers.appendChild(div);
        }
    });
}

loadUsers();

</script>

</body>
</html>
