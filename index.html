<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obedová pauza</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .date {
    color: #888;
    font-size: 16px;
    }
    .headerRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

#refreshButton {
    border: none;
    background: transparent;
    color: #999;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    transition: all 0.2s ease;
}

#refreshButton:hover {
    color: #2e7d32;
    transform: rotate(90deg);
}
        .user {
            font-size: 24px;
            padding: 12px 0;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .available {
            color: #2e7d32;
            font-weight: bold;
        }

        .unavailable {
            color: #999999;
        }

        .separator {
            height: 50px;
        }
    </style>
</head>
<body>

    <h1 id="headerEmoji">🍽️☕🚶</h1>

    <div class="headerRow">
    <div id="today" class="date"></div>
    <button id="refreshButton" onclick="location.reload()">↻</button>
    </div>

    <div id="availableUsers"></div>

    <div class="separator"></div>

    <div id="unavailableUsers"></div>

    <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIgpNqTfom-cIQVmDTU351KxFfK-BiRdM",
            authDomain: "obedna-pauza.firebaseapp.com",
            projectId: "obedna-pauza",
            storageBucket: "obedna-pauza.firebasestorage.app",
            messagingSenderId: "344992044371",
            appId: "1:344992044371:web:174bca2238030df816fda6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const availableUsers = document.getElementById("availableUsers");
        const unavailableUsers = document.getElementById("unavailableUsers");
        let adminClicks = 0;

        const today = new Date().toLocaleDateString("sv-SE");

        const weekday = new Date().toLocaleDateString(
            "sk-SK",
            { weekday: "long" }
        );

        const datePart = new Date().toLocaleDateString("sk-SK");

        document.getElementById("today").textContent =
            `${weekday}, ${datePart}`;

        document
    .getElementById("headerEmoji")
    .addEventListener("click", async () => {

        adminClicks++;

        if (adminClicks < 4) {
            return;
        }

        adminClicks = 0;

        const fullName = prompt(
            "Zadaj meno a priezvisko"
        );

 if (!fullName) {
    return;
}

const userId = createUserId(fullName);

await setDoc(
    doc(db, "users", userId),
    {
        name: fullName,
        available: false,
        date: ""
    }
);

await loadUsers();

    });
        
        function surname(name) {
            const parts = name.trim().split(" ");
            return parts[parts.length - 1].toLowerCase();
        }

        function displayName(name) {

            const parts = name.trim().split(" ");

            if (parts.length < 2) {
                return name;
            }

            const firstName = parts[0];
            const lastName = parts.slice(1).join(" ");

            return `${lastName} ${firstName}`;
        }

function createUserId(fullName) {

    const parts = fullName.trim().split(" ");

    const surname = parts[parts.length - 1];

    return surname
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

        
        function sortContainer(container) {

            const items = Array.from(container.children);

            items.sort((a, b) =>
                surname(a.dataset.name).localeCompare(
                    surname(b.dataset.name),
                    "sk"
                )
            );

            items.forEach(item =>
                container.appendChild(item)
            );
        }

async function toggleUser(user) {

    const activeToday =
        user.available === true &&
        user.date === today;

    try {

        await updateDoc(
            doc(db, "users", user.id),
            {
                available: !activeToday,
                date: today
            }
        );

    } catch (error) {
        console.error(error);
    }

    await loadUsers();
}

async function loadUsers() {

    const users = [];

    const querySnapshot =
        await getDocs(collection(db, "users"));

    querySnapshot.forEach((userDoc) => {

        users.push({
            id: userDoc.id,
            ...userDoc.data()
        });

    });

    renderUsers(users);
}
        
function renderUsers(users) {

    availableUsers.innerHTML = "";
    unavailableUsers.innerHTML = "";

    users.sort((a, b) =>
        surname(a.name).localeCompare(
            surname(b.name),
            "sk"
        )
    );

    users.forEach((user) => {

        const activeToday =
            user.available === true &&
            user.date === today;

        const div = document.createElement("div");

        div.className =
            "user " +
            (activeToday
                ? "available"
                : "unavailable");

        div.textContent =
            displayName(user.name);

        div.addEventListener("click", () => {
            toggleUser(user);
        });

        if (activeToday) {
            availableUsers.appendChild(div);
        } else {
            unavailableUsers.appendChild(div);
        }
    });
}
document
    .getElementById("refreshButton")
    .addEventListener("click", loadUsers);
loadUsers();



    </script>

</body>
</html>
